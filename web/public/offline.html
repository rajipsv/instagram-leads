<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e40af">
  <title>Offline · Growth Intelligence</title>
  <link rel="icon" href="/icons/icon.svg">
  <style>
    :root { --bg:#f8fafc; --surface:#fff; --text:#0f172a; --muted:#475569; --primary:#1e40af; --primary-hover:#1e3a8a; --soft:#dbeafe; --btn-text:#fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b1220; --surface:#111a2e; --text:#e2e8f0; --muted:#9fb0cc; --primary:#60a5fa; --primary-hover:#93c5fd; --soft:#1e3a8a55; --btn-text:#0b1220; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text);
           font-family:"Fira Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 360px; text-align: center; }
    .icon { width:56px; height:56px; margin:0 auto 16px; border-radius:50%; background:var(--soft); display:grid; place-items:center; color:var(--primary); }
    h1 { font-family:"Fira Code", ui-monospace, monospace; font-size:20px; margin:0; }
    p { color:var(--muted); line-height:1.55; margin:8px 0 0; }
    .row { display:flex; gap:8px; justify-content:center; margin-top:24px; flex-wrap:wrap; }
    button, a { cursor:pointer; border-radius:6px; padding:8px 16px; font:500 15px inherit; font-family:inherit; text-decoration:none; transition:background-color .2s; }
    button { border:0; background:var(--primary); color:var(--btn-text); }
    button:hover { background:var(--primary-hover); }
    a { border:1px solid #cbd5e1; color:var(--text); }
    :focus-visible { outline:2px solid #3b82f6; outline-offset:2px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.43"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>This page hasn't been opened on this device yet, so there's no saved copy. Pages you've visited before still open offline.</p>
    <div class="row">
      <button onclick="location.reload()">Try again</button>
      <a href="/">Businesses</a>
    </div>
  </main>
</body>
</html>
